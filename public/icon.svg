<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c14" />
      <stop offset="50%" stop-color="#0d111c" />
      <stop offset="100%" stop-color="#05060a" />
    </linearGradient>
    <linearGradient id="nGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>
    <linearGradient id="nGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0c3fc" />
      <stop offset="100%" stop-color="#8ec5fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#1f293d" stroke-width="4" />
  
  <!-- Subtle futuristic circuit grid -->
  <circle cx="256" cy="256" r="180" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.25" />
  <circle cx="256" cy="256" r="220" stroke="#7f00ff" stroke-width="1" stroke-dasharray="4 8" opacity="0.15" />

  <!-- NONONICK Geometric 'N' Symbol -->
  <g filter="url(#glow)">
    <!-- Left vertical bar -->
    <path d="M148 140 L196 140 L196 372 L148 372 Z" fill="url(#nGrad1)" rx="8" />
    <!-- Diagonal crossbar -->
    <path d="M180 140 L228 140 L332 372 L284 372 Z" fill="url(#nGrad1)" />
    <!-- Right vertical bar -->
    <path d="M316 140 L364 140 L364 372 L316 372 Z" fill="url(#nGrad2)" rx="8" />
    <!-- Top accent spark -->
    <circle cx="172" cy="140" r="10" fill="#00f2fe" />
    <circle cx="340" cy="372" r="10" fill="#a78bfa" />
    <circle cx="256" cy="256" r="7" fill="#ffffff" />
  </g>
</svg>
